name: Build check

# Actual deploys are handled by Cloudflare Pages' own GitHub integration
# (connected in the Cloudflare dashboard) — this workflow is just a
# build-sanity check on pull requests, with no secrets and no deploy step.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
