<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
    <title>Contact — Dana Lee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Schibsted+Grotesk&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="size-small.css">
    <link rel="stylesheet" href="size-large.css">
    <style>
        .contact-form label {
            display: block;
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
        }
        .contact-form input,
        .contact-form select {
            width: 100%;
            height: 80px;
            background: #F5F5F5;
            border: none;
            border-radius: 1rem;
            padding: 0 1.5rem;
            font-family: 'Schibsted Grotesk', sans-serif;
            font-size: 1.2rem;
            color: #111;
            outline: none;
            transition: box-shadow 0.3s ease;
        }
        .contact-form textarea {
            width: 100%;
            min-height: 220px;
            background: #F5F5F5;
            border: none;
            border-radius: 1rem;
            padding: 1.5rem;
            font-family: 'Schibsted Grotesk', sans-serif;
            font-size: 1.2rem;
            color: #111;
            outline: none;
            resize: none;
            transition: box-shadow 0.3s ease;
        }
        .contact-form input:focus,
        .contact-form select:focus,
        .contact-form textarea:focus {
            box-shadow: inset 0 0 0 1.5px black;
        }
        /* Error state */
        .contact-form input.error,
        .contact-form input.error:focus {
            box-shadow: inset 0 0 0 1.5px #d11;
        }
        .field-error {
            color: #d11;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
        .field-error[hidden] {
            display: none;
        }
        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: #aaa;
        }
        /* Custom select: hide native arrow, draw our own */
        .select-wrap {
            position: relative;
        }
        .contact-form select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: none;
        }
        .contact-form select.placeholder {
            color: #aaa;
        }
        .select-wrap::after {
            content: "↓";
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 1.3rem;
            color: #111;
        }
        .submit-btn {
            display: inline-flex;
            align-items: center;
            padding: 1rem 2.5rem;
            background-color: black;
            color: white;
            font-family: 'Schibsted Grotesk', sans-serif;
            font-size: 1.2rem;
            border: none;
            border-radius: 2rem;
            cursor: none;
        }
        .submit-btn .btn-arrow {
            height: 1.4rem;
            width: 0;
            opacity: 0;
            margin-left: 0;
            overflow: hidden;
            fill: currentColor;
            flex-shrink: 0;
            transition: width 0.3s ease, opacity 0.3s ease, margin-left 0.3s ease;
        }
        .submit-btn:hover .btn-arrow {
            width: 1.4rem;
            opacity: 1;
            margin-left: 0.6rem;
        }
        /* Align the form to the hero text's left edge (.introduction is 60vw, pushed right with a 5rem right margin) */
        .contact-section {
            margin-left: calc(40vw - 5rem);
            margin-right: 5rem;
            margin-bottom: 4rem;
        }
        @media (max-width: 1024px) {
            .contact-section {
                margin-left: 2rem;
                margin-right: 2rem;
            }
        }
        /* On mobile, anchor the hero text to the bottom of the screen with a 32px
           gap. Use dvh (not vh) so the address bar can't push the last line off
           the bottom and clip it. */
        @media (max-width: 1024px) {
            .introduction {
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                box-sizing: border-box;
                height: auto;
                min-height: 100dvh;
                margin: 0 2rem 2rem;
                padding: 0 0 2rem;
            }
        }
        /* On mobile, make the footer buttons square (height matches full width). */
        @media (max-width: 767px) {
            #more-work, #about, #contact {
                height: auto;
                aspect-ratio: 1 / 1;
            }
        }
    </style>
</head>
<body class="bg-white text-gray-900">
    <main>
        <header id="header" class="fixed top-0 left-0 w-screen bg-transparent transition-transform duration-300 p-4 px-4 z-10">
            <nav class="flex justify-between items-center mx-auto space-x-4">
                <a href="index.html" class="text-6xl">🍽️</a>
                <ul class="flex space-x-4">
                    <li><a href="about.html" class="nav-item">About</a></li>
                    <li><a href="index.html#work" class="nav-item">Work</a></li>
                    <li><a href="contact.html" class="nav-item">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- Hero -->
        <section class="introduction">
            <section class="flex">
                <h1 class="hero-text">Let's talk. I'm great in meetings, dangerous with typography, and fun at parties.</h1>
            </section>
        </section>

        <!-- Contact Form -->
        <section class="contact-section">
            <!-- Success / error messages -->
            <div id="form-status" class="mb-6 hidden rounded-2xl p-4 text-center text-lg"></div>

            <form
                    action="contact.php"
                    method="POST"
                    class="contact-form space-y-8"
                    novalidate
                >
                    <div>
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required />
                        <p class="field-error" id="name-error" hidden>Please enter your name.</p>
                    </div>
                    <div>
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" required />
                        <p class="field-error" id="email-error" hidden>Please enter a valid email address.</p>
                    </div>
                    <div>
                        <label for="organization">Organization</label>
                        <div class="select-wrap">
                            <select id="organization" name="organization">
                                <option value="" disabled selected>Select one</option>
                                <option>Start-Up</option>
                                <option>Non-Profit</option>
                                <option>Government Agency</option>
                                <option>Corporation</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label for="project">Project</label>
                        <div class="select-wrap">
                            <select id="project" name="project">
                                <option value="" disabled selected>Select</option>
                                <option>Visual Identity</option>
                                <option>Design System</option>
                                <option>Website Design</option>
                                <option>Product Design</option>
                                <option>Landing Page</option>
                                <option>Concept Envisioning</option>
                                <option>Campaign Branding</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label for="message">Other notes</label>
                        <textarea id="message" name="message"></textarea>
                    </div>
                    <div>
                        <button type="submit" class="submit-btn">
                            <span>Send it</span>
                            <svg class="btn-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>
                        </button>
                    </div>
                </form>
        </section>

        <!-- Footer -->
        <section id="footer" class="grid grid-cols-6 gap-4 m-4">
            <a href="index.html#work" class="block col-span-6 md:col-span-3">
                <section class="flex items-center justify-center roundy h-auto" id="more-work">
                    <h2 class="text-4xl">Work</h2>
                </section>
            </a>
            <a href="about.html" class="block col-span-6 md:col-span-3">
                <section class="flex items-center justify-center roundy" id="about">
                    <h2 class="text-4xl">About</h2>
                </section>
            </a>
        </section>
    </main>

    <script src="dotcursor.js"></script>
    <script src="random-colors.js"></script>
    <script src="favicon.js"></script>
    <script src="header.js?v=2"></script>
    <script>
        // Gray the placeholder text on selects until a real option is chosen
        document.querySelectorAll('.contact-form select').forEach((sel) => {
            const sync = () => sel.classList.toggle('placeholder', sel.value === '');
            sync();
            sel.addEventListener('change', sync);
        });

        // Custom error states (replacing the browser's default validation bubbles)
        const contactForm = document.querySelector('.contact-form');
        const nameInput = document.getElementById('name');
        const nameError = document.getElementById('name-error');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('email-error');

        const showError = (input, msgEl, invalid) => {
            input.classList.toggle('error', invalid);
            msgEl.hidden = !invalid;
        };

        // Name is required
        const validateName = (force = false) => {
            const invalid = nameInput.value.trim() === '';
            showError(nameInput, nameError, invalid);
            return !invalid;
        };
        // Email is required and must be a valid address.
        // On blur we only flag a badly-formatted value; emptiness is only flagged on submit.
        const validateEmail = (force = false) => {
            const value = emailInput.value.trim();
            const invalid = force ? (value === '' || !emailInput.checkValidity())
                                  : (value !== '' && !emailInput.checkValidity());
            showError(emailInput, emailError, invalid);
            return value !== '' && emailInput.checkValidity();
        };

        nameInput.addEventListener('blur', () => validateName());
        nameInput.addEventListener('input', () => {
            if (nameInput.classList.contains('error')) validateName();
        });
        emailInput.addEventListener('blur', () => validateEmail());
        emailInput.addEventListener('input', () => {
            if (emailInput.classList.contains('error')) validateEmail();
        });

        contactForm.addEventListener('submit', (e) => {
            const nameOk = validateName(true);
            const emailOk = validateEmail(true);
            if (!nameOk || !emailOk) {
                e.preventDefault();
                (!nameOk ? nameInput : emailInput).focus();
            }
        });

        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');
        const el = document.getElementById('form-status');
        if (status === 'success') {
            el.textContent = "Message sent! I'll be in touch soon.";
            el.style.backgroundColor = 'lightseagreen';
            el.style.color = 'white';
            el.classList.remove('hidden');
        } else if (status === 'error') {
            el.textContent = "Something went wrong. Try emailing me directly at danalee.seattle@gmail.com.";
            el.style.backgroundColor = '#fee2e2';
            el.style.color = '#991b1b';
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
